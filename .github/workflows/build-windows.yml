name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Instalar dependencias fijadas
        run: python -m pip install -r requirements.lock

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Construir onedir
        shell: pwsh
        run: |
          $args = @("--noconfirm","--clean","--windowed","--onedir","--name","PDF_Facil")
          $args += @("--icon","assets/icon.ico","--add-data","assets;assets")
          pyinstaller @args pdf_facil.py

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          if (-not (Test-Path dist/PDF_Facil/PDF_Facil.exe)) { throw "Falta PDF_Facil.exe" }
          if (-not (Test-Path dist/PDF_Facil/_internal)) { throw "Faltan dependencias (_internal)" }
          Get-ChildItem dist/PDF_Facil | Select-Object Name, Length

      - name: ZIP y SHA-256
        shell: pwsh
        run: |
          Copy-Item README.md dist/PDF_Facil/LEEME.md
          Compress-Archive -Path dist/PDF_Facil -DestinationPath PDF_Facil-Windows-x64.zip
          $h = (Get-FileHash PDF_Facil-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  PDF_Facil-Windows-x64.zip" | Out-File -Encoding ascii PDF_Facil-Windows-x64.zip.sha256
          Write-Host "SHA-256: $h"
          "SHA-256 ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - name: Determinar versión
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = (Select-String -Path app/version.py -Pattern '^__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $v"

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Construir instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/PDFacil.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló" }
          $f = "installer_output/PDFacil-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $f)) { throw "Falta $f" }
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$h  PDFacil-Setup-${{ steps.ver.outputs.version }}.exe" | Out-File -Encoding ascii "$f.sha256"
          "Instalador SHA-256 ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: PDF_Facil-Windows-x64
          path: |
            PDF_Facil-Windows-x64.zip
            PDF_Facil-Windows-x64.zip.sha256
            installer_output/PDFacil-Setup-*.exe
            installer_output/PDFacil-Setup-*.exe.sha256

      - name: Publicar release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PDF_Facil-Windows-x64.zip
            PDF_Facil-Windows-x64.zip.sha256
            installer_output/PDFacil-Setup-*.exe
            installer_output/PDFacil-Setup-*.exe.sha256
