name: build-windows

# Tag vX.Y.Z -> compila, valida y publica Release (PDFacil-Setup.exe + ZIP portable).
# Ejecución manual -> solo compila y deja los artefactos (no publica).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Determinar versión
        id: ver
        shell: pwsh
        run: |
          $file = (Select-String -Path app/version.py -Pattern '^__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($v -ne $file) { throw "El tag ($v) no coincide con app/version.py ($file)" }
          } else { $v = $file }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $v"

      - name: Instalar dependencias fijadas
        run: python -m pip install -r requirements.lock

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Construir onedir
        shell: pwsh
        run: |
          $a = @("--noconfirm","--clean","--windowed","--onedir","--name","PDF_Facil")
          $a += @("--icon","assets/icon.ico","--add-data","assets;assets")
          pyinstaller @a pdf_facil.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller falló" }
          if (-not (Test-Path dist/PDF_Facil/PDF_Facil.exe)) { throw "Falta PDF_Facil.exe" }
          if (-not (Test-Path dist/PDF_Facil/_internal)) { throw "Faltan dependencias (_internal)" }

      - name: ZIP portable
        shell: pwsh
        run: |
          Copy-Item README.md dist/PDF_Facil/LEEME.md
          Compress-Archive -Path dist/PDF_Facil -DestinationPath PDF_Facil-Windows-x64.zip

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup" }
          }

      - name: Construir instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/PDFacil.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló" }

      - name: Verificar instalador y huellas
        shell: pwsh
        run: |
          $setup = "installer_output/PDFacil-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Falta $setup" }
          if ((Get-Item $setup).Length -lt 10MB) { throw "Instalador sospechosamente pequeño" }
          foreach ($f in @($setup, "PDF_Facil-Windows-x64.zip")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)" | Out-File -Encoding ascii "$f.sha256"
            "$(Split-Path $f -Leaf): SHA-256 ``$h``" >> $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PDF_Facil-Windows-x64
          if-no-files-found: error
          path: |
            PDF_Facil-Windows-x64.zip
            PDF_Facil-Windows-x64.zip.sha256
            installer_output/PDFacil-Setup.exe
            installer_output/PDFacil-Setup.exe.sha256

  release:
    # Solo corre si TODO el job build pasó y es un tag.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDF_Facil-Windows-x64
          path: release

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/installer_output/PDFacil-Setup.exe
            release/installer_output/PDFacil-Setup.exe.sha256
            release/PDF_Facil-Windows-x64.zip
            release/PDF_Facil-Windows-x64.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
